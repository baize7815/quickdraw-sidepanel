<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Local-first drawing versus optional network features</title>
  <desc id="desc">Canvas, notes, diagrams, and local image tools stay in the browser. AI tasks and online background removal send selected inputs to third-party services.</desc>
  <rect width="1280" height="400" rx="28" fill="#f4f7fb"/>
  <text x="48" y="46" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#4263EB" font-weight="700">DATA BOUNDARY</text>
  <text x="48" y="80" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#152033" font-weight="700">Local-first. Network only when you ask.</text>

  <rect x="48" y="112" width="720" height="244" rx="24" fill="#ffffff" stroke="#d7e2f3"/>
  <rect x="48" y="112" width="10" height="244" rx="5" fill="#16876b"/>
  <text x="84" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#152033" font-weight="700">Stays in this browser</text>
  <text x="84" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#7a889c">NO PROJECT ACCOUNT · CHROME STORAGE + INDEXEDDB</text>
  <rect x="84" y="204" width="200" height="52" rx="14" fill="#eef8f3"/>
  <text x="184" y="236" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#14624f">Canvas / notes / maps</text>
  <rect x="296" y="204" width="200" height="52" rx="14" fill="#eef8f3"/>
  <text x="396" y="236" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#14624f">Crop / mask / trace</text>
  <rect x="508" y="204" width="228" height="52" rx="14" fill="#eef8f3"/>
  <text x="622" y="236" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#14624f">Local OpenCV Telea</text>
  <rect x="84" y="272" width="200" height="52" rx="14" fill="#eef8f3"/>
  <text x="184" y="304" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#14624f">Mermaid import</text>
  <rect x="296" y="272" width="200" height="52" rx="14" fill="#eef8f3"/>
  <text x="396" y="304" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#14624f">PNG / SVG / project</text>
  <rect x="508" y="272" width="228" height="52" rx="14" fill="#eef8f3"/>
  <text x="622" y="304" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#14624f">No API key in the UI</text>

  <rect x="792" y="112" width="440" height="244" rx="24" fill="#ffffff" stroke="#d7e2f3"/>
  <rect x="792" y="112" width="10" height="244" rx="5" fill="#d97706"/>
  <text x="828" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#152033" font-weight="700">Leaves the machine</text>
  <text x="828" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#7a889c">OPTIONAL · USER-TRIGGERED</text>
  <rect x="828" y="208" width="372" height="44" rx="12" fill="#fff6e8"/>
  <text x="1014" y="236" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#8a4b00">ChatGPT / Doubao / Grok web tasks</text>
  <rect x="828" y="264" width="372" height="44" rx="12" fill="#fff6e8"/>
  <text x="1014" y="292" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#8a4b00">Koukoutu background removal upload</text>
  <text x="828" y="332" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#7a889c">Uses your logged-in provider tab, not an API key field.</text>
</svg>
