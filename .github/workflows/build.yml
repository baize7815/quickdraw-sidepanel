name: 打包并发布 Quickdraw

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-v3.9.4]') }}
    runs-on: ubuntu-latest

    steps:
      - name: 获取代码
        uses: actions/checkout@v5

      - name: 读取版本号
        id: version
        run: |
          VERSION=$(node -p "require('./quickdraw-sidepanel/manifest.json').version")
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "filename=quickdraw-sidepanel-v$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: 打包扩展
        run: |
          cd quickdraw-sidepanel
          zip -r "../${{ steps.version.outputs.filename }}" .

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            "${{ steps.version.outputs.filename }}" \
            --title "Quickdraw ${{ steps.version.outputs.version }}" \
            --notes-file "releases/${{ steps.version.outputs.version }}.md" \
            --target "${{ github.sha }}"
