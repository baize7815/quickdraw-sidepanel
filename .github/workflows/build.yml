name: 打包扩展

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 打包 ZIP
        run: |
          zip -r quickdraw-sidepanel.zip . \
            -x ".git/*" \
               ".github/*" \
               "tests/*" \
               "releases/*" \
               "*.zip"

      - name: 上传打包文件
        uses: actions/upload-artifact@v4
        with:
          name: quickdraw-sidepanel
          path: quickdraw-sidepanel.zip
